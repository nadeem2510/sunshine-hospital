name: Weekly Blog Auto-Generator

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and publish blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKEND_URL: https://sunshine-hospital-backend.onrender.com
        run: python .github/scripts/generate_blog.py
